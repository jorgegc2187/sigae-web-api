spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
    mfa:
      encryption-key: ${SIGAE_MFA_ENCRYPTION_KEY}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  bootstrap:
    admin:
      enabled: false
