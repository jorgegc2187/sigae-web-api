spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sigae}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-this-jwt-secret-with-at-least-32-characters}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  bootstrap:
    admin:
      enabled: true
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Administrador SIGAE}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@sigae.edu.pe}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:admin123456}
