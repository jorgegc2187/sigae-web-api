spring:
  datasource:
    url: jdbc:h2:mem:sigae;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  flyway:
    enabled: false
  auth:
    recovery:
      mail-enabled: false
      frontend-url: http://localhost:4200
      mail-from: no-reply@sigae.test
  security:
    jwt:
      issuer: sigae-api-test
      secret: test-secret-key-that-is-long-enough-for-hs256-signing
      access-token-ttl: PT15M
      refresh-token-ttl: P1D
      password-reset-token-ttl: PT30M
    mfa:
      encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      challenge-ttl: PT5M
      max-attempts: 5
      issuer: SIGAE Test
    cors:
      allowed-origins: http://localhost:4200
  bootstrap:
    admin:
      enabled: false
