spring:
  application:
    name: sigae-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:sigae-api}
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}
      password-reset-token-ttl: ${JWT_PASSWORD_RESET_TOKEN_TTL:PT1H}
    mfa:
      encryption-key: ${SIGAE_MFA_ENCRYPTION_KEY}
      challenge-ttl: ${MFA_CHALLENGE_TTL:PT5M}
      max-attempts: ${MFA_MAX_ATTEMPTS:5}
      issuer: ${MFA_ISSUER:SIGAE}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    abuse-protection:
      login:
        account-max-attempts: ${AUTH_LOGIN_ACCOUNT_MAX_ATTEMPTS:5}
        account-window: ${AUTH_LOGIN_ACCOUNT_WINDOW:PT15M}
        lock-duration: ${AUTH_LOGIN_LOCK_DURATION:PT15M}
        ip-max-attempts: ${AUTH_LOGIN_IP_MAX_ATTEMPTS:20}
        ip-window: ${AUTH_LOGIN_IP_WINDOW:PT15M}
      forgot-password:
        email-max-attempts: ${AUTH_FORGOT_PASSWORD_EMAIL_MAX_ATTEMPTS:3}
        email-window: ${AUTH_FORGOT_PASSWORD_EMAIL_WINDOW:PT30M}
        ip-max-attempts: ${AUTH_FORGOT_PASSWORD_IP_MAX_ATTEMPTS:10}
        ip-window: ${AUTH_FORGOT_PASSWORD_IP_WINDOW:PT30M}
      reset-password:
        validate-max-attempts: ${AUTH_RESET_PASSWORD_VALIDATE_MAX_ATTEMPTS:10}
        validate-window: ${AUTH_RESET_PASSWORD_VALIDATE_WINDOW:PT15M}
        submit-max-attempts: ${AUTH_RESET_PASSWORD_SUBMIT_MAX_ATTEMPTS:5}
        submit-window: ${AUTH_RESET_PASSWORD_SUBMIT_WINDOW:PT15M}
      refresh:
        token-max-attempts: ${AUTH_REFRESH_TOKEN_MAX_ATTEMPTS:30}
        token-window: ${AUTH_REFRESH_TOKEN_WINDOW:PT15M}
      mfa:
        start-max-attempts: ${AUTH_MFA_START_MAX_ATTEMPTS:3}
        start-window: ${AUTH_MFA_START_WINDOW:PT15M}
        verify-max-attempts: ${AUTH_MFA_VERIFY_MAX_ATTEMPTS:5}
        verify-window: ${AUTH_MFA_VERIFY_WINDOW:PT10M}
  bootstrap:
    admin:
      enabled: false
  auth:
    recovery:
      mail-enabled: ${MAIL_ENABLED:true}
      frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
      mail-from: ${MAIL_FROM:no-reply@sigae.local}
