spring:
  application:
    name: sigae-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:sigae-api}
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}
      password-reset-token-ttl: ${JWT_PASSWORD_RESET_TOKEN_TTL:PT1H}
    mfa:
      encryption-key: ${SIGAE_MFA_ENCRYPTION_KEY}
      challenge-ttl: ${MFA_CHALLENGE_TTL:PT5M}
      max-attempts: ${MFA_MAX_ATTEMPTS:5}
      issuer: ${MFA_ISSUER:SIGAE}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  bootstrap:
    admin:
      enabled: false
  auth:
    recovery:
      mail-enabled: ${MAIL_ENABLED:true}
      frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
      mail-from: ${MAIL_FROM:no-reply@sigae.local}
